<section class="panel dash" id="dash" hidden>
  <p class="label">Time remaining</p>
  <p class="clock" id="remaining" aria-live="off">--:--:--</p>
  <dl class="facts">
    <div><dt>Purchased</dt><dd id="purchased">-</dd></div>
    <div><dt>Expires</dt><dd id="expires">-</dd></div>
    <div><dt>Connection</dt><dd id="conn">-</dd></div>
    <div><dt>Speed limit</dt><dd id="speed">-</dd></div>
  </dl>
  <p class="small">To add time, insert another coin below. Time keeps running while you are connected.</p>
  <button id="btn-disconnect" class="ghost danger">Disconnect and end session</button>
</section>
