{% extends "admin_base.html" %}
{% block title %}Change password{% endblock %}
{% block content %}
<form method="post" class="card narrow">
  <h1>Change administrator password</h1>
  {% if admin.must_change_password %}<p>You must set a new password before continuing.</p>{% endif %}
  <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
  <label>Current password <input name="current" type="password" autocomplete="current-password" required></label>
  <label>New password (min 8 characters) <input name="new" type="password" autocomplete="new-password" minlength="8" required></label>
  <label>Confirm new password <input name="confirm" type="password" autocomplete="new-password" minlength="8" required></label>
  <button class="primary">Update password</button>
</form>
{% endblock %}
